# Quantumult X minimal profile; generated by scripts/generate.py.
# Complete profile: DNS settings are included below; no DNS snippet import needed.
# Import private nodes locally, then select the AI and global exit nodes.
# DNS mode: split. DoH encryption does not imply proxy transport.
