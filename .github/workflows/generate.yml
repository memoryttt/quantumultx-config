name: Generate QX resources
on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/generate.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qx-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate.py
      - name: Commit generated resources
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add qx.conf rules/ai.list snippets/ai-dns.conf snippets/integration.conf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update generated QX resources'
          git push
